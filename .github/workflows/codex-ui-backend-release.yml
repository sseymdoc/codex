name: Codex UI backend release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "New tag, for example backend-v0.164.0-codex-ui.1"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: codex-ui-backend-release
  cancel-in-progress: false

jobs:
  windows-x64:
    if: github.repository == 'sseymdoc/codex'
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      BACKEND_TAG: ${{ inputs.tag }}
      TARGET: x86_64-pc-windows-msvc
      CODEX_REPO_ROOT: ${{ github.workspace }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Validate new release tag
        run: |
          if ($env:BACKEND_TAG -notmatch '^backend-v[0-9][A-Za-z0-9.+-]*$') { throw 'Invalid backend release tag' }
      - name: Configure sandbox-enabled V8 with upstream checksums
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-pc-windows-msvc
      - name: Build backend and matching Windows helpers
        working-directory: codex-rs
        run: |
          cargo build --release --locked --target $env:TARGET -p codex-cli -p codex-code-mode-host -p codex-windows-sandbox -p codex-windows-sandbox-service --bins
          if ($LASTEXITCODE -ne 0) { throw 'Backend build failed' }
      - name: Verify code-mode host transports
        working-directory: codex-rs
        run: |
          cargo test --release --locked --target $env:TARGET -p codex-code-mode-host --test stdio --test grpc_tcp
          if ($LASTEXITCODE -ne 0) { throw 'Code-mode host verification failed' }
      - name: Stage complete backend package
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'backend-package'
          $bin = Join-Path $package 'bin'
          New-Item -ItemType Directory -Path $bin -Force | Out-Null
          $names = @('codex', 'codex-code-mode-host', 'codex-command-runner', 'codex-windows-sandbox-setup', 'codex-windows-sandbox-service', 'codex-windows-managed-deny-probe')
          foreach ($name in $names) {
            Copy-Item -LiteralPath "codex-rs/target/$env:TARGET/release/$name.exe" -Destination $bin
          }
          & (Join-Path $bin 'codex.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'Packaged backend does not start' }
          # ripgrep is not built here: the package builder's pinned DotSlash manifest gives its version and digest.
          # It goes in codex-path, as in the official packages; codex-ui puts that folder first on PATH.
          $rg = python -c "import sys; sys.path.insert(0, 'scripts'); from codex_package.ripgrep import fetch_rg; from codex_package.targets import TARGET_SPECS; print(fetch_rg(TARGET_SPECS[sys.argv[1]]))" $env:TARGET
          if ($LASTEXITCODE -ne 0) { throw 'ripgrep fetch failed' }
          $tools = Join-Path $package 'codex-path'
          New-Item -ItemType Directory -Path $tools -Force | Out-Null
          Copy-Item -LiteralPath $rg -Destination $tools
          & (Join-Path $tools 'rg.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'Packaged ripgrep does not start' }
          $files = Get-ChildItem -LiteralPath $package -Recurse -File | ForEach-Object {
            [ordered]@{ file = [IO.Path]::GetRelativePath($package, $_.FullName).Replace('\', '/'); sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(); bytes = $_.Length }
          }
          [ordered]@{ sourceCommit = $env:GITHUB_SHA; target = $env:TARGET; profile = 'release'; files = @($files) } | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $package 'codex-backend.json') -Encoding utf8
          $archive = Join-Path $env:RUNNER_TEMP "codex-package-$env:TARGET.tar.gz"
          tar -czf $archive -C $package bin codex-path codex-backend.json
          if ($LASTEXITCODE -ne 0) { throw 'Backend packaging failed' }
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $archive -Leaf)" | Set-Content "$archive.sha256" -Encoding ascii
      - name: Upload backend package
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: backend-${{ env.TARGET }}
          path: |
            ${{ runner.temp }}/codex-package-${{ env.TARGET }}.tar.gz
            ${{ runner.temp }}/codex-package-${{ env.TARGET }}.tar.gz.sha256
          if-no-files-found: error

  macos-arm64:
    if: github.repository == 'sseymdoc/codex'
    runs-on: macos-15
    timeout-minutes: 120
    env:
      TARGET: aarch64-apple-darwin
      BACKEND_TAG: ${{ inputs.tag }}
      CODEX_REPO_ROOT: ${{ github.workspace }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Validate new release tag
        run: |
          [[ "$BACKEND_TAG" =~ ^backend-v[0-9][A-Za-z0-9.+-]*$ ]] || { echo 'Invalid backend release tag'; exit 1; }
      - name: Configure sandbox-enabled V8 with upstream checksums
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: aarch64-apple-darwin
      - name: Build backend
        working-directory: codex-rs
        run: cargo build --release --locked --target "$TARGET" -p codex-cli -p codex-code-mode-host --bins
      - name: Verify code-mode host transports
        working-directory: codex-rs
        run: cargo test --release --locked --target "$TARGET" -p codex-code-mode-host --test stdio --test grpc_tcp
      - name: Stage complete backend package
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/backend-package"
          mkdir -p "$package/bin" "$package/codex-path"
          for name in codex codex-code-mode-host; do
            cp "codex-rs/target/$TARGET/release/$name" "$package/bin/"
          done
          "$package/bin/codex" --version
          # ripgrep comes from the package builder's pinned DotSlash manifest, into codex-path as on Windows.
          rg="$(python3 -c "import sys; sys.path.insert(0, 'scripts'); from codex_package.ripgrep import fetch_rg; from codex_package.targets import TARGET_SPECS; print(fetch_rg(TARGET_SPECS[sys.argv[1]]))" "$TARGET")"
          cp "$rg" "$package/codex-path/"
          "$package/codex-path/rg" --version
          python3 - "$package" <<'EOF'
          import hashlib, json, os, sys
          root = sys.argv[1]
          files = []
          for directory, _, names in sorted(os.walk(root)):
              for name in sorted(names):
                  data = open(os.path.join(directory, name), "rb").read()
                  files.append({"file": os.path.relpath(os.path.join(directory, name), root), "sha256": hashlib.sha256(data).hexdigest(), "bytes": len(data)})
          manifest = {"sourceCommit": os.environ["GITHUB_SHA"], "target": os.environ["TARGET"], "profile": "release", "files": files}
          with open(os.path.join(root, "codex-backend.json"), "w") as out:
              json.dump(manifest, out, indent=2)
          EOF
          # COPYFILE_DISABLE: macOS tar would otherwise add ._ files for extended attributes.
          COPYFILE_DISABLE=1 tar -czf "$RUNNER_TEMP/codex-package-$TARGET.tar.gz" -C "$package" bin codex-path codex-backend.json
          cd "$RUNNER_TEMP"
          shasum -a 256 "codex-package-$TARGET.tar.gz" > "codex-package-$TARGET.tar.gz.sha256"
      - name: Upload backend package
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: backend-${{ env.TARGET }}
          path: |
            ${{ runner.temp }}/codex-package-${{ env.TARGET }}.tar.gz
            ${{ runner.temp }}/codex-package-${{ env.TARGET }}.tar.gz.sha256
          if-no-files-found: error

  # One release once every platform built, so the latest release never lacks a platform's package.
  publish:
    needs: [windows-x64, macos-arm64]
    runs-on: ubuntu-latest
    env:
      BACKEND_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: backend-*
          merge-multiple: true
          path: packages
      - name: Publish backend release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$BACKEND_TAG" packages/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Codex UI backend $BACKEND_TAG" --notes "Source: $GITHUB_SHA. Release backends with matching code-mode host and pinned ripgrep: Windows x64 (with the Windows sandbox helpers) and macOS arm64."
